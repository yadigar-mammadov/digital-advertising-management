spring.application.name=digital-advertising-management

spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

google.ads.client-id=${GOOGLE_ADS_CLIENT_ID}
google.ads.client-secret=${GOOGLE_ADS_CLIENT_SECRET}
google.ads.refresh-token=${GOOGLE_ADS_REFRESH_TOKEN}
google.ads.developer-token=${GOOGLE_ADS_DEVELOPER_TOKEN}
google.ads.login-customer-id=${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
google.ads.enabled=${GOOGLE_ADS_ENABLED:false}

meta.ads.ad-account-id=${META_AD_ACCOUNT_ID}
meta.ads.access-token=${META_ACCESS_TOKEN}
meta.ads.app-secret=${META_APP_SECRET}